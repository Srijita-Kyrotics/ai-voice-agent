<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="glow-text">AI Voice Companion</h1>
            <p class="subtitle">Experience the future of conversation</p>
        </header>

        <main aria-live="polite">
            <div id="status-container">
                <div id="recording-indicator" class="hidden"></div>
                <span id="status-text">Click the microphone to start</span>
            </div>

            <div id="transcript-container" class="glass-panel">
                <div id="conversation-log">
                    <div class="message system">Welcome! I'm ready to listen.</div>
                </div>
            </div>

            <div class="controls">
                <button id="mic-btn" class="mic-button" aria-label="Toggle Microphone">
                    <svg class="mic-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <div class="secondary-controls">
                    <button id="clear-btn" class="text-button" title="Clear Conversation Memory">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        Clear Memory
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <div class="voice-visualizer hidden" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
